<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<style>
  :root{
    --bg: #0b0e0c;
    --panel: #121613;
    --line: #24302a;
    --dial: #d7f7e3;
    --accent: #4ee08a;
    --accent-dim: #1f6b46;
    --danger: #ff6b5e;
    --muted: #6f8478;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #141a16 0%, var(--bg) 60%);
    font-family: var(--mono);
    color: var(--dial);
    padding: 24px;
  }

  .case{
    width: 380px;
    max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 28px 24px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 30px 60px -20px rgba(0,0,0,0.7);
    position: relative;
  }

  .case::before{
    content:"";
    position:absolute;
    top:-6px; left:50%;
    transform: translateX(-50%);
    width: 60px; height: 12px;
    background: var(--line);
    border-radius: 0 0 8px 8px;
  }

  .brand{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 22px;
  }

  .brand .status{
    display:flex;
    align-items:center;
    gap:6px;
  }

  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--muted);
    transition: background .2s ease, box-shadow .2s ease;
  }
  .dot.live{
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1s infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.4; }
  }

  .display{
    text-align:center;
    padding: 18px 0 22px;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 20px;
  }

  .time{
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height:1;
    font-variant-numeric: tabular-nums;
  }
  .ms{
    font-size: 26px;
    color: var(--muted);
  }

  .controls{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }

  button{
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #0f1310;
    color: var(--dial);
    cursor: pointer;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  button:active{ transform: scale(0.97); }
  button:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #startBtn{
    grid-column: 1 / -1;
    background: var(--accent-dim);
    border-color: var(--accent);
    color: #d9ffe9;
  }
  #startBtn.running{
    background: #4a1d18;
    border-color: var(--danger);
    color: #ffe1dc;
  }
  #startBtn:hover{ filter: brightness(1.15); }

  #lapBtn:disabled, #resetBtn:disabled{
    opacity: .35;
    cursor: not-allowed;
  }
  #lapBtn:not(:disabled):hover, #resetBtn:not(:disabled):hover{
    border-color: var(--muted);
  }

  .laps{
    max-height: 160px;
    overflow-y: auto;
    font-size: 13px;
  }
  .laps::-webkit-scrollbar{ width: 6px; }
  .laps::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }

  .lap-row{
    display:flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
  }
  .lap-row:first-child{ color: var(--dial); }
  .lap-row .n{ color: var(--muted); width: 44px; }
  .lap-row .split{ margin-left: auto; padding-left: 12px; }

  .laps:empty::after{
    content: "No laps yet";
    display:block;
    text-align:center;
    color: var(--muted);
    padding: 18px 0 4px;
    font-size: 12px;
    letter-spacing: 1px;
  }

  @media (prefers-reduced-motion: reduce){
    .dot.live{ animation: none; }
  }
</style>
</head>
<body>

<div class="case">
  <div class="brand">
    <span>Stopwatch</span>
    <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">Ready</span></span>
  </div>

  <div class="display">
    <span class="time" id="time">00:00</span><span class="ms" id="ms">.00</span>
  </div>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="lapBtn" disabled>Lap</button>
    <button id="resetBtn" disabled>Reset</button>
  </div>

  <div class="laps" id="laps"></div>
</div>

<script>
  const timeEl = document.getElementById('time');
  const msEl = document.getElementById('ms');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsEl = document.getElementById('laps');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let startTime = 0;
  let elapsed = 0;
  let running = false;
  let rafId = null;
  let lapCount = 0;
  let lastLapElapsed = 0;

  function format(ms){
    const totalMs = Math.floor(ms);
    const minutes = Math.floor(totalMs / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const centis = Math.floor((totalMs % 1000) / 10);
    const pad = (n, l=2) => String(n).padStart(l, '0');
    return {
      main: `${pad(minutes)}:${pad(seconds)}`,
      ms: `.${pad(centis)}`
    };
  }

  function render(ms){
    const f = format(ms);
    timeEl.textContent = f.main;
    msEl.textContent = f.ms;
  }

  function tick(){
    if(!running) return;
    const now = performance.now();
    render(elapsed + (now - startTime));
    rafId = requestAnimationFrame(tick);
  }

  function start(){
    running = true;
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);

    startBtn.textContent = 'Pause';
    startBtn.classList.add('running');
    lapBtn.disabled = false;
    resetBtn.disabled = false;
    statusDot.classList.add('live');
    statusText.textContent = 'Running';
  }

  function pause(){
    running = false;
    cancelAnimationFrame(rafId);
    elapsed += performance.now() - startTime;

    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
    lapBtn.disabled = true;
    statusDot.classList.remove('live');
    statusText.textContent = 'Paused';
  }

  function reset(){
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = 0;
    lastLapElapsed = 0;
    lapCount = 0;
    render(0);
    lapsEl.innerHTML = '';

    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
    lapBtn.disabled = true;
    resetBtn.disabled = true;
    statusDot.classList.remove('live');
    statusText.textContent = 'Ready';
  }

  function lap(){
    const current = elapsed + (performance.now() - startTime);
    const split = current - lastLapElapsed;
    lastLapElapsed = current;
    lapCount++;

    const f = format(current);
    const fs = format(split);

    const row = document.createElement('div');
    row.className = 'lap-row';
    row.innerHTML = `<span class="n">#${lapCount}</span><span>${f.main}${f.ms}</span><span class="split">+${fs.main}${fs.ms}</span>`;
    lapsEl.prepend(row);
  }

  startBtn.addEventListener('click', () => running ? pause() : start());
  lapBtn.addEventListener('click', lap);
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space'){ e.preventDefault(); running ? pause() : start(); }
    if(e.code === 'KeyL' && !lapBtn.disabled){ lap(); }
    if(e.code === 'KeyR' && !resetBtn.disabled){ reset(); }
  });

  render(0);
</script>

</body>
</html>
