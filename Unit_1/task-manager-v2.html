<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef1ea;
    --paper: #fbfbf7;
    --ink: #1f2a24;
    --muted: #7c8a80;
    --line: #dde3d8;

    --todo: #8b9a8f;
    --progress: #d99a3d;
    --done: #3f7d5c;

    --danger: #c15a4a;

    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(63,125,92,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(217,154,61,0.07), transparent 40%);
    font-family: var(--sans);
    color: var(--ink);
    padding: 40px 24px 70px;
  }

  .wrap{ max-width: 1080px; margin: 0 auto; }

  header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 24px;
  }

  header h1{
    font-family: var(--serif);
    font-weight: 700;
    font-size: 34px;
    margin: 0;
    letter-spacing: -0.5px;
  }
  header p{
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13.5px;
  }

  .progress-wrap{
    min-width: 220px;
  }
  .progress-label{
    display:flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .progress-track{
    height: 8px;
    border-radius: 6px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--progress), var(--done));
    border-radius: 6px;
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }

  .add-form{
    display:flex;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 28px;
    box-shadow: 0 1px 2px rgba(31,42,36,0.04);
  }

  .add-form input[type="text"]{
    flex: 1;
    border: none;
    outline: none;
    font-size: 14.5px;
    font-family: var(--sans);
    padding: 11px 14px;
    background: transparent;
    color: var(--ink);
  }
  .add-form input::placeholder{ color: var(--muted); }

  .add-form select{
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--bg);
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink);
    padding: 0 12px;
    cursor: pointer;
  }

  .add-form button{
    border: none;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    padding: 0 22px;
    border-radius: 9px;
    cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  .add-form button:hover{ opacity: .88; }
  .add-form button:active{ transform: scale(0.97); }

  .board{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 820px){
    .board{ grid-template-columns: 1fr; }
  }

  .column{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 6px;
    min-height: 220px;
    transition: background .15s ease;
  }
  .column.drag-over{ background: #f4f6ef; }

  .col-inner{ padding: 14px; }

  .col-bar{
    height: 4px;
    border-radius: 4px 4px 0 0;
    margin: -6px -6px 14px;
  }
  .col-todo .col-bar{ background: var(--todo); }
  .col-progress .col-bar{ background: var(--progress); }
  .col-done .col-bar{ background: var(--done); }

  .col-head{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 0 8px;
    margin-bottom: 12px;
  }

  .col-title{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 15.5px;
  }

  .col-count{
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    background: var(--bg);
    padding: 2px 9px;
    border-radius: 20px;
  }

  .cards{
    display:flex;
    flex-direction: column;
    gap: 10px;
    min-height: 40px;
    padding: 0 6px 6px;
  }

  .card{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 13px 10px;
    cursor: grab;
    display:flex;
    gap: 10px;
    align-items: flex-start;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{ border-color: #c8d1c1; }
  .card:active{ cursor: grabbing; }
  .card.dragging{ opacity: 0.4; }

  .check{
    flex: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    margin-top: 1px;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--paper);
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .check:hover{ border-color: var(--done); }
  .check svg{
    width: 12px; height: 12px;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity .15s ease, transform .15s ease;
  }
  .card.is-done .check{
    background: var(--done);
    border-color: var(--done);
    animation: pop .25s ease;
  }
  .card.is-done .check svg{
    opacity: 1;
    transform: scale(1);
  }
  @keyframes pop{
    0%{ transform: scale(0.8); }
    50%{ transform: scale(1.15); }
    100%{ transform: scale(1); }
  }

  .card-body{ flex: 1; min-width: 0; }

  .card .text{
    font-size: 14px;
    line-height: 1.45;
    margin-bottom: 8px;
    word-break: break-word;
    transition: color .2s ease;
  }
  .card.is-done .text{
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--muted);
  }

  .card-foot{
    display:flex;
    justify-content: space-between;
    align-items:center;
  }

  .card-move{ display:flex; gap: 4px; }

  .icon-btn{
    border: none;
    background: none;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    padding: 3px 7px;
    border-radius: 6px;
    font-family: var(--mono);
  }
  .icon-btn:hover{ background: var(--line); color: var(--ink); }
  .icon-btn.delete:hover{ background: #f4ded9; color: var(--danger); }

  .empty-hint{
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Task Manager</h1>
      <p>Tick a task to mark it complete — or drag cards between columns</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>OVERALL</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <form class="add-form" id="addForm">
    <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off" required>
    <select id="statusSelect">
      <option value="todo">To Do</option>
      <option value="progress">In Progress</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <div class="board">
    <div class="column col-todo" data-status="todo">
      <div class="col-inner">
        <div class="col-bar"></div>
        <div class="col-head">
          <span class="col-title">To Do</span>
          <span class="col-count" id="count-todo">0</span>
        </div>
      </div>
      <div class="cards" id="cards-todo"></div>
    </div>

    <div class="column col-progress" data-status="progress">
      <div class="col-inner">
        <div class="col-bar"></div>
        <div class="col-head">
          <span class="col-title">In Progress</span>
          <span class="col-count" id="count-progress">0</span>
        </div>
      </div>
      <div class="cards" id="cards-progress"></div>
    </div>

    <div class="column col-done" data-status="done">
      <div class="col-inner">
        <div class="col-bar"></div>
        <div class="col-head">
          <span class="col-title">Completed</span>
          <span class="col-count" id="count-done">0</span>
        </div>
      </div>
      <div class="cards" id="cards-done"></div>
    </div>
  </div>
</div>

<script>
  const STATUSES = ['todo', 'progress', 'done'];
  let tasks = [];
  let idCounter = 1;
  let draggedId = null;

  const addForm = document.getElementById('addForm');
  const taskInput = document.getElementById('taskInput');
  const statusSelect = document.getElementById('statusSelect');
  const progressFill = document.getElementById('progressFill');
  const progressPct = document.getElementById('progressPct');

  function createTask(text, status){
    return { id: idCounter++, text, status, prevStatus: 'todo' };
  }

  function render(){
    STATUSES.forEach(status => {
      const container = document.getElementById(`cards-${status}`);
      container.innerHTML = '';
      const list = tasks.filter(t => t.status === status);
      document.getElementById(`count-${status}`).textContent = list.length;

      if(list.length === 0){
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.textContent = 'No tasks here';
        container.appendChild(hint);
        return;
      }

      list.forEach(task => container.appendChild(buildCard(task)));
    });

    const total = tasks.length;
    const done = tasks.filter(t => t.status === 'done').length;
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
  }

  function buildCard(task){
    const isDone = task.status === 'done';

    const card = document.createElement('div');
    card.className = 'card' + (isDone ? ' is-done' : '');
    card.draggable = true;
    card.dataset.id = task.id;

    const check = document.createElement('div');
    check.className = 'check';
    check.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    check.title = isDone ? 'Mark as not done' : 'Mark as complete';
    check.onclick = () => toggleDone(task.id);

    const body = document.createElement('div');
    body.className = 'card-body';

    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = task.text;

    const foot = document.createElement('div');
    foot.className = 'card-foot';

    const moveWrap = document.createElement('div');
    moveWrap.className = 'card-move';

    if(!isDone){
      const idx = STATUSES.indexOf(task.status);
      if(idx > 0){
        const back = document.createElement('button');
        back.className = 'icon-btn';
        back.textContent = '←';
        back.title = 'Move back';
        back.onclick = () => moveTask(task.id, STATUSES[idx - 1]);
        moveWrap.appendChild(back);
      }
      const fwd = document.createElement('button');
      fwd.className = 'icon-btn';
      fwd.textContent = '→';
      fwd.title = 'Move forward';
      fwd.onclick = () => moveTask(task.id, STATUSES[idx + 1]);
      moveWrap.appendChild(fwd);
    }

    const del = document.createElement('button');
    del.className = 'icon-btn delete';
    del.textContent = '✕';
    del.title = 'Delete task';
    del.onclick = () => deleteTask(task.id);

    foot.appendChild(moveWrap);
    foot.appendChild(del);

    body.appendChild(text);
    body.appendChild(foot);

    card.appendChild(check);
    card.appendChild(body);

    card.addEventListener('dragstart', () => {
      draggedId = task.id;
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      draggedId = null;
    });

    return card;
  }

  function toggleDone(id){
    const task = tasks.find(t => t.id === id);
    if(!task) return;
    if(task.status === 'done'){
      task.status = task.prevStatus || 'todo';
    } else {
      task.prevStatus = task.status;
      task.status = 'done';
    }
    render();
  }

  function moveTask(id, newStatus){
    const task = tasks.find(t => t.id === id);
    if(task){
      if(task.status !== 'done') task.prevStatus = task.status;
      task.status = newStatus;
      render();
    }
  }

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  document.querySelectorAll('.column').forEach(col => {
    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      if(draggedId !== null){
        moveTask(draggedId, col.dataset.status);
      }
    });
  });

  addForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = taskInput.value.trim();
    if(!text) return;
    tasks.push(createTask(text, statusSelect.value));
    taskInput.value = '';
    render();
  });

  // Seed with a few example tasks
  const t1 = createTask('Design the landing page', 'todo');
  t1.status = 'done'; t1.prevStatus = 'todo';
  const t2 = createTask('Set up database schema', 'progress');
  const t3 = createTask('Write API documentation', 'todo');
  tasks.push(t1, t2, t3);
  render();
</script>

</body>
</html>
